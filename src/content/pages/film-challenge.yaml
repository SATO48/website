seo:
  title: The Film Challenge · SATO48
  description: >-
    One weekend, one film. Teams get their Inspiration Package at Kickoff, then
    have 48 hours to write, shoot and edit an original film of five minutes or
    less.
header:
  eyebrow: 48-hour filmmaking · since 2006
  title: The Film Challenge
  breadcrumb: Film Challenge
  intro: >-
    One weekend, one film. Teams get their Inspiration Package at Kickoff, then
    have 48 hours to write, shoot and edit an original film of five minutes or
    less. Every film that meets the rules screens at the festival.
