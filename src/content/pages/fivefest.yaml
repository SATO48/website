seo:
  title: 'FiveFest: Five Minute Film Festival · SATO48'
  description: >-
    Films of five minutes or less, in any of eight genres, from filmmakers
    anywhere. Every film is scored by our Academy Judges and screens online; the
    best play the big screen in Springfield.
