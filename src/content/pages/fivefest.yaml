guidelines:
  eyebrow: 2026 guidelines
  heading: What to send us.
  intro: >-
    FiveFest is presented by Hlabeard Productions with the SATO48 Film Challenge.
    Film Challenge teams get a free FiveFest submission with registration.
  cards:
    - title: Your film
      points:
        - Five minutes or less, credits included. Longer files can't be uploaded.
        - Complete and ready for theater projection. No works in progress.
        - Non-English dialogue needs English subtitles or an English dub.
    - title: Technical
      points:
        - 720p minimum resolution.
        - Clear audio.
        - A poster and other promotional materials are encouraged, not required.
    - title: Who can enter
      points:
        - Any filmmaker, any age, anywhere.
        - No limit on when the film was made.
        - Submit through FilmFreeway.
genres:
  heading: Eight genres. Eight awards.
  intro: >-
    Industry professionals and filmmaking community members judge every entry.
    Last year's registered Film Challenge team members can join as Academy
    Judges.
  items:
    - name: Animation
      criteria:
        - Innovative animation techniques
        - Storytelling and emotional impact
        - Artistic merit and design
        - Voice performances
    - name: Comedy
      criteria:
        - Original, well-written script
        - Comedic timing and delivery
        - Ensemble chemistry
        - Direction that lands the humor
    - name: Documentary
      criteria:
        - Depth of subject and research
        - Narrative structure and pacing
        - Cinematography and visual cohesion
        - Impact, originality and insight
    - name: Drama
      criteria:
        - Complex characters and story
        - Quality of performances
        - Direction and pacing
        - Cinematic craft
    - name: Experimental
      criteria:
        - Innovation in technique
        - Narrative and conceptual ambiguity
        - Visual and aural design
        - Engagement and provocation
    - name: Horror
      criteria:
        - Fear, suspense and thrill
        - Original concept and execution
        - Technical craft of atmosphere
        - Depth of story
    - name: Music Video
      criteria:
        - Creative, original visuals
        - Music and image working together
        - Direction and choreography
        - Technical quality
    - name: Musical
      criteria:
        - Music woven into the story
        - Quality of the numbers
        - Choreography and staging
        - Direction of musical sequences
  link:
    label: Full judging criteria by genre →
    href: /resources/fivefest-guidelines-2026/
tiers:
  heading: Every film gets seen.
  items:
    - eyebrow: Accepted · every film
      title: Scorecard + online screening
      body: >-
        A FiveFest Scorecard showing how the Academy Judges responded, plus an
        exclusive month-long online screening.
      featured: false
    - eyebrow: Selected
      title: Big screen + nomination
      body: >-
        An in-theater screening at a festival location, and recognition as a
        Nominee at the October FiveFest Awards Ceremony.
      featured: false
    - eyebrow: Genre winner
      title: Statuette + the stage
      body: >-
        With a representative checked in at the ceremony: a statuette, an on-stage
        acceptance speech and a backstage interview.
      featured: true
  note: Filmmakers are told their film's acceptance level by email.
dates:
