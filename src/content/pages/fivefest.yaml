    - label: In-theater screenings
      value: Scheduled around venue capacity
    - label: Venue
      value: >-
        Alamo Drafthouse Cinema, Springfield, Missouri, the largest Alamo
        Drafthouse in the United States. Wheelchair accessible.
finePrint:
  heading: The fine print.
  body: |
    - **Rights.** You must own all rights to your film. You grant Hlabeard Productions and SATO48 in-theater and paywalled online screening rights for the festival, plus free online use in Festival Manager and promotional use in perpetuity.
    - **Endorsement.** Acceptance isn't an endorsement of a film's content.
    - **Liability.** Hlabeard Productions and SATO48 aren't liable for losses or damages, including from unavoidable cancellations or delays; we'll try to reschedule.
    - **Inclusion.** FiveFest is committed to diversity and inclusion.
  contact: |
    Questions? [support@sato48.com](mailto:support@sato48.com) or the [Helpdesk](https://help.sato48.com/en/).
  link:
    label: Full 2026 FiveFest guidelines →
    href: /resources/fivefest-guidelines-2026/
