<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Site nav · SATO48</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Inter:wght@400;600;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav style="font-family: Inter, Arial, sans-serif; color: #FFFFFF; line-height: 1.5; background: rgba(10,14,26,.92); backdrop-filter: blur(8px); border-bottom: 1px solid #1E2638">
<div style="max-width: 1160px; margin: 0 auto; padding: 0 24px; position: relative; display: flex; flex-wrap: wrap; align-items: center; column-gap: 28px">
<a href="Main.dc.html" style="height: 68px; display: flex; align-items: center; margin-right: auto"><img src="/_blob/3895383ea4894dab2ac8a8e35b39d7d0" alt="SATO48 2027, home" style="height: 40px; display: block"></a>
<ul class="nav-links" style="display: flex; align-items: center; justify-content: flex-end; gap: 22px; list-style: none; margin: 0; padding: 0 clamp(0px, calc((100% - 640px) * 999), 156px) clamp(0px, calc((640px - 100%) * 999), 14px) 0; flex: 1 1 max(0px, calc((640px - 100%) * 999)); white-space: nowrap; font-weight: 600; font-size: 15px">
<li><a href="FilmChallenge.dc.html" style="text-decoration: none; color: {{challengeColor}}">Film Challenge</a></li>
<li><a href="FiveFest.dc.html" style="text-decoration: none; color: {{fivefestColor}}">FiveFest</a></li>
<li><a href="Resources.dc.html" style="text-decoration: none; color: {{resourcesColor}}">Resources</a></li>
<li aria-hidden="true" style="flex: 1 1 0; max-width: max(0px, calc((640px - 100%) * 999))"></li>
</ul>
<a class="btn-primary nav-tickets" href="https://portal.sato48.com/archive" style="position: absolute; top: 14px; right: 24px; display: inline-flex; align-items: center; gap: 8px; font-weight: 800; text-decoration: none; border-radius: 999px; padding: 6px 16px; font-size: 14px; letter-spacing: .02em; background: #FF6C00; color: #0A0E1A; border: 3px solid #0A0E1A; box-shadow: 3px 3px 0 #3996B1">▶ The Archive</a>
</div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["home","challenge","fivefest","resources","other"],"default":"home"},"$preview":{"width":1440,"height":68}}'>
class Component extends DCLogic {
renderVals() {
const current = this.props.current ?? 'home';
const on = '#FF6C00', off = '#E6E6EE';
return {
challengeColor: current === 'challenge' ? on : off,
fivefestColor: current === 'fivefest' ? on : off,
resourcesColor: current === 'resources' ? on : off
};
}
}
</script>
</body>
</html>
